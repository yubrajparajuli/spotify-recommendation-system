version: "3.9"

services:
  backend:
    build: .
    container_name: spotify-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./spotify.db:/app/spotify.db

    restart: unless-stopped

    command: .venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: spotify-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped
