services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: spotify-backend

    env_file:
      - .env

    expose:
      - "8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: spotify-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped
